name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache-bust public assets with commit SHA
        run: |
          SHA=$(git rev-parse --short HEAD)
          # ru/index.html sits one level down and reaches the assets through
          # ../, so the prefix is captured and put back rather than dropped.
          for f in index.html cv.html hooh.html hooh-fill.html itab.html itab-specialists.html \
                   ru/index.html ru/cv.html ru/hooh.html ru/hooh-fill.html ru/itab.html ru/itab-specialists.html; do
            if [ -f "$f" ]; then
              sed -i -E 's#(href|src)="(\.\./)?(styles\.min\.css|typographer\.js|shimmer\.js|case\.js)(\?v=[^"]*)?"#\1="\2\3?v='"$SHA"'"#g' "$f"
              echo "Injected asset version $SHA into $f"
            fi
          done
          grep -h -E -o '(\.\./)?(styles\.min\.css|typographer\.js|shimmer\.js|case\.js)\?v=[^"]*' \
            index.html cv.html hooh.html hooh-fill.html itab.html itab-specialists.html \
            ru/*.html | sort -u

      # Syno stays visible as a non-clickable "Coming soon" card on the
      # homepage. Keep its working file in the repository, but do not publish
      # the unfinished direct URL until the case and its assets are ready.
      # The specialists case is held back the same way while it is still
      # being worked on — both language versions, or /ru/ would serve a page
      # the English site does not have.
      - name: Exclude draft pages from the public artifact
        run: |
          rm -f \
            syno.html \
            syno-cover-proto.html \
            hooh-trust-proto.html \
            hooh-color-proto.html \
            hooh-editor.html \
            hooh-editor-ru.html \
            hooh-fill-clouds.html \
            hooh-fill-ru.html \
            itab-proto.html


      # Cloudflare Web Analytics. The beacon is injected here rather than kept
      # in the page sources, so every published page carries it without having
      # to be listed anywhere, and so pages opened from disk while working do
      # not report visits. The step runs after the draft removal above, which
      # is what keeps unfinished pages out of the counter as well as the site.
      - name: Add the analytics beacon to every published page
        env:
          CF_BEACON_TOKEN: a44507ecd2b34673965ce2891e24d42d
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          beacon = (
              "  <!-- Cloudflare Web Analytics --><script type='module' "
              "src='https://static.cloudflareinsights.com/beacon.min.js' "
              "data-cf-beacon='{\"token\": \"%s\"}'></script>\n"
              % os.environ["CF_BEACON_TOKEN"]
          )
          for page in sorted(Path(".").rglob("*.html")):
              if page.parts[0] in {"tools", "tmp", "output"}:
                  continue
              html = page.read_text(encoding="utf-8")
              if "</body>" not in html:
                  print("No closing body tag, skipped %s" % page)
                  continue
              page.write_text(html.replace("</body>", beacon + "</body>", 1), encoding="utf-8")
              print("Beacon added to %s" % page)
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
