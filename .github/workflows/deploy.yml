name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache-bust styles.css with commit SHA
        run: |
          SHA=$(git rev-parse --short HEAD)
          for f in index.html hooh.html; do
            if [ -f "$f" ]; then
              sed -i "s|href=\"styles.css\"|href=\"styles.css?v=$SHA\"|g" "$f"
              echo "Injected ?v=$SHA into $f"
            fi
          done
          grep -h -o "styles\.css[^\"]*" index.html hooh.html | head -5

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
