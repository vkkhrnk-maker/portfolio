<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>Page not found · Victoria Kukharenko</title>
  <!-- Self-contained on purpose: GitHub Pages serves this file for ANY
       missing path, so relative asset URLs can't be trusted here. The
       font falls back to Georgia if the absolute path doesn't resolve. -->
  <style>
    @font-face {
      font-family: 'PP Editorial New';
      src: url('/portfolio/fonts/PPEditorialNew-Regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #f0f0f0;
      color: #2d3036;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    h1 {
      font-family: 'PP Editorial New', Georgia, serif;
      font-weight: 400;
      font-size: clamp(96px, 18vw, 200px);
      line-height: 1;
      letter-spacing: -4px;
    }
    p { font-size: 18px; color: rgba(0, 0, 0, 0.62); max-width: 34em; }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 34px;
      border-radius: 999px;
      background: #d946ef;
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      box-shadow: inset -3px -4px 14px 0 rgba(255, 255, 255, 0.5), inset 3px 4px 14px 0 rgba(255, 255, 255, 0.5);
    }
    a.btn:hover { filter: brightness(1.05); }
    /* Same dark palette as styles.css — this page is self-contained on purpose. */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { color-scheme: dark; }
      :root:not([data-theme="light"]) body { background: #131316; color: #ececee; }
      :root:not([data-theme="light"]) p { color: rgba(255, 255, 255, 0.66); }
      :root:not([data-theme="light"]) a.btn {
        background: #a72cc0;
        box-shadow: inset -3px -4px 14px 0 rgba(255, 255, 255, 0.14), inset 3px 4px 14px 0 rgba(255, 255, 255, 0.14);
      }
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>This page doesn&rsquo;t exist &mdash; the work does.</p>
  <a class="btn" href="/">Back to works</a>
</body>
</html>
