<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>Page not found · Victoria Kukharenko</title>
  <!-- Self-contained on purpose: GitHub Pages serves this file for ANY
       missing path, so relative asset URLs can't be trusted here. The
       font falls back to Georgia if the absolute path doesn't resolve.
       The path is /fonts/ — the site moved off the /portfolio/ project
       URL onto its own domain, and this reference was left behind.
       Only "404" is set in the display face, and digits are the same in
       both languages, so this page needs no Cyrillic font. -->
  <style>
    @font-face {
      font-family: 'PP Editorial New';
      src: url('/fonts/PPEditorialNew-Regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #f0f0f0;
      color: #2d3036;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    h1 {
      font-family: 'PP Editorial New', Georgia, serif;
      font-weight: 400;
      font-size: clamp(96px, 18vw, 200px);
      line-height: 1;
      letter-spacing: -4px;
    }
    p { font-size: 18px; color: rgba(0, 0, 0, 0.62); max-width: 34em; }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 34px;
      border-radius: 999px;
      background: #d946ef;
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      box-shadow: inset -3px -4px 14px 0 rgba(255, 255, 255, 0.5), inset 3px 4px 14px 0 rgba(255, 255, 255, 0.5);
    }
    a.btn:hover { filter: brightness(1.05); }
    /* Same dark palette as styles.css — this page is self-contained on purpose. */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { color-scheme: dark; }
      :root:not([data-theme="light"]) body { background: #131316; color: #ececee; }
      :root:not([data-theme="light"]) p { color: rgba(255, 255, 255, 0.66); }
      :root:not([data-theme="light"]) a.btn {
        background: #a72cc0;
        box-shadow: inset -3px -4px 14px 0 rgba(255, 255, 255, 0.14), inset 3px 4px 14px 0 rgba(255, 255, 255, 0.14);
      }
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <p data-copy>This page doesn&rsquo;t exist &mdash; the work does.</p>
  <a class="btn" data-home href="/">Back to works</a>

  <script>
    /* GitHub Pages serves this one file for every missing path, at the root
       and under /ru/ alike, so there is no second Russian 404 to route to —
       the page swaps its own two strings instead. Same preference the rest of
       the site uses: an explicit choice wins, otherwise the browser's top
       language decides. */
    (function () {
      var ru = false;
      try {
        var saved = localStorage.getItem('lang');
        if (saved) {
          ru = saved === 'ru';
        } else {
          var langs = navigator.languages || [navigator.language || ''];
          for (var i = 0; i < langs.length; i++) {
            var l = String(langs[i]).toLowerCase();
            if (l.indexOf('en') === 0) break;
            if (l.indexOf('ru') === 0) { ru = true; break; }
          }
        }
      } catch (e) {}
      if (!ru) return;
      document.documentElement.lang = 'ru';
      document.title = 'Страница не найдена · Victoria Kukharenko';
      document.querySelector('[data-copy]').textContent = 'Такой страницы нет — а работы есть.';
      var home = document.querySelector('[data-home]');
      home.textContent = 'К работам';
      home.href = '/ru/';
    })();
  </script>
</body>
</html>
